---
name: python
"on": pull_request
permissions:
  contents: read
  packages: read
jobs:
  mcvs-python-action:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
