---
name: mcvs-python-action
description: |
  The Mission Critical Vulnerability Scanner (MCVS) Python action.
inputs:
  linter:
    description: |
      ruff, flake8 or none. Defaults to ruff for uv projects and flake8 for
      pip projects. ruff runs from the project environment with the project's
      own configuration, and any finding fails the build.
  package-manager:
    default: auto
    description: |
      How to install the project: auto, uv or pip. auto picks uv when a
      uv.lock exists and pip with requirements.txt otherwise.
  pyinstaller-binary-name:
    description: The name of the binary that is created using pyinstaller.
  pyinstaller-entrypoint:
    default: main.py
    description: The Python script that pyinstaller turns into a binary.
  type-check-args:
    description: |
      Arguments for the type checker, e.g. '--strict packages/*/src'. Globs
      are expanded.
  type-checker:
    default: none
    description: |
      mypy, pyright or none. The type checker must be a project dependency.
  pytest-args:
    description: |
      Extra pytest arguments, e.g. '-m "not integration"'. Quoting works as in
      a shell.
  test-paths:
    description: |
      Paths to test, e.g. 'packages/*/tests'. Globs are expanded. Defaults to
      pytest's own discovery.
  working-directory:
    default: .
    description: |
      Directory of the Python project, for monorepos. For a uv workspace this
      is the workspace root.
  token:
    description: |
      A token is required to allow the mcvs-python-action to push the
      package that it has been built, to the packages repository of the GitHub
      repository where the action has been run.
    required: true
runs:
  using: composite
  steps:
    #
    # Install the python version that has been defined in the .python-version
    # file.
    #
    # yamllint disable-line rule:line-length
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        cache: pip
        # yamllint disable-line rule:line-length
        python-version-file: ${{ inputs.working-directory != '.' && format('{0}/.python-version', inputs.working-directory) || '' }}
    #
    # Code security scanning.
    #
    # yamllint disable-line rule:line-length
    - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        only-fixed: false
        output-format: table
        path: .
        severity-cutoff: high
    #
    # Pick the package manager and check the inputs. 'run' is the prefix used
    # to call project tools like ruff, mypy and pytest from the installed
    # environment.
    #
    - name: Resolve package manager and check inputs
      id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LINTER: ${{ inputs.linter }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        TYPE_CHECKER: ${{ inputs.type-checker }}
      run: |
        pm=${PACKAGE_MANAGER}
        if [ "${pm}" = auto ]; then
          if [ -f uv.lock ]; then pm=uv; else pm=pip; fi
        fi
        case "${pm}" in
          uv) run="uv run --no-sync" ;;
          pip) run="python3 -m" ;;
          *) echo "::error::bad package-manager"; exit 1 ;;
        esac
        case "${TYPE_CHECKER}" in
          mypy|pyright|none) ;;
          *) echo "::error::bad type-checker"; exit 1 ;;
        esac
        case "${LINTER}" in
          ''|ruff|flake8|none) ;;
          *) echo "::error::bad linter"; exit 1 ;;
        esac
        echo "package-manager=${pm}" >> "${GITHUB_OUTPUT}"
        echo "run=${run}" >> "${GITHUB_OUTPUT}"
    # yamllint disable-line rule:line-length
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      if: ${{ steps.resolve.outputs.package-manager == 'uv' }}
      with:
        working-directory: ${{ inputs.working-directory }}
    #
    # Install the project: uv sync for uv, requirements.txt (if any) for pip.
    #
    - name: Install packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE_MANAGER: ${{ steps.resolve.outputs.package-manager }}
      run: |
        requirements_file=requirements.txt
        if [ "${PACKAGE_MANAGER}" = uv ]; then
          uv sync --all-packages --frozen
        elif [ -f ${requirements_file} ]; then
          pip install \
            --requirement ${requirements_file}
        fi
    #
    # Run pytest from the project environment for uv projects or when a test
    # input is set. Otherwise keep the legacy behaviour: run test.py with
    # coverage of main if 'import pytest' is found.
    #
    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE_MANAGER: ${{ steps.resolve.outputs.package-manager }}
        # pytest splits PYTEST_ADDOPTS like a shell, so quoting in the input
        # works without eval.
        PYTEST_ADDOPTS: ${{ inputs.pytest-args }}
        RUN: ${{ steps.resolve.outputs.run }}
        TEST_PATHS: ${{ inputs.test-paths }}
      run: |
        if [ "${PACKAGE_MANAGER}" = uv ] ||
          [ -n "${PYTEST_ADDOPTS}${TEST_PATHS}" ]; then
          # Unquoted on purpose: split the paths and expand globs.
          ${RUN} pytest ${TEST_PATHS}
        elif grep -r 'import pytest' *.py; then
          pytest \
            --capture=no \
            --cov=main test.py \
            --cov-report term-missing \
            --verbose
        fi
    #
    # Lint code with ruff, using the project's own configuration.
    #
    - name: Code linting with ruff
      # yamllint disable-line rule:line-length
      if: ${{ inputs.linter == 'ruff' || (inputs.linter == '' && steps.resolve.outputs.package-manager == 'uv') }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RUN: ${{ steps.resolve.outputs.run }}
      run: |
        ${RUN} ruff format --check .
        ${RUN} ruff check .
    #
    # Type check with mypy or pyright from the project environment.
    #
    - name: Type checking
      if: ${{ inputs.type-checker != 'none' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RUN: ${{ steps.resolve.outputs.run }}
        TYPE_CHECK_ARGS: ${{ inputs.type-check-args }}
        TYPE_CHECKER: ${{ inputs.type-checker }}
      run: |
        # Unquoted on purpose: split the args and expand globs.
        ${RUN} ${TYPE_CHECKER} ${TYPE_CHECK_ARGS}
    #
    # Lint code with Flake8
    #
    # yamllint disable rule:line-length
    - name: Code linting with Flake8
      if: ${{ inputs.linter == 'flake8' || (inputs.linter == '' && steps.resolve.outputs.package-manager == 'pip') }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python3 -m pip install \
          --require-hashes \
          --user \
          --requirement \
            ${GITHUB_ACTION_PATH}/configs/pip/flake8/requirements.txt

        errors=$(flake8 -v --max-line-length=150 --exclude=client/,.venv/,venv/ --count --statistics --exit-zero .)
        echo "Flake8 reported $errors errors/warnings."

        # Compare count to threshold, fail pipeline if above threshold
        if [ "$errors" -gt 4 ]; then
          echo "Too many issues — failing."
          exit 1
        else
          echo "Issues within acceptable range — passing."
        fi
    #
    # Build binary using pyinstaller and attach it to a release once a tag has
    # been created.
    #
    - name: Check Conditions
      id: condition_check
      run: |
        if [ "${PACKAGE_MANAGER}" = uv ]; then
          echo "::error::pyinstaller builds are only supported for pip projects"
          exit 1
        fi
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE_MANAGER: ${{ steps.resolve.outputs.package-manager }}
      if: ${{ github.event_name == 'push' && contains(github.ref, 'refs/tags/') && inputs.pyinstaller-binary-name != '' }}
    # yamllint enable rule:line-length
    - name: Build binary using pyinstaller
      if: ${{ steps.condition_check.outcome == 'success' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BINARY_NAME: ${{ inputs.pyinstaller-binary-name }}
        ENTRYPOINT: ${{ inputs.pyinstaller-entrypoint }}
      run: |
        python3 -m pip install \
          --require-hashes \
          --user \
          --requirement \
            ${GITHUB_ACTION_PATH}/configs/pip/pyinstaller/requirements.txt
        python3 -m PyInstaller --onefile "${ENTRYPOINT}" --name "${BINARY_NAME}"
    # yamllint disable-line rule:line-length
    - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
      name: Attach a binary to a release
      if: ${{ steps.condition_check.outcome == 'success' }}
      with:
        repo_token: ${{ inputs.token }}
        # yamllint disable-line rule:line-length
        file: ${{ inputs.working-directory }}/dist/${{ inputs.pyinstaller-binary-name }}
        asset_name: ${{ inputs.pyinstaller-binary-name }}
        tag: ${{ github.ref }}
