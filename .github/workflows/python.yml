---
name: python
"on": pull_request
permissions:
  contents: read
  packages: read
jobs:
  mcvs-python-action:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
